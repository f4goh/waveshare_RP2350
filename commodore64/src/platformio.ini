; ============================================================================
; PlatformIO Configuration — Commodore 64 (Frodo4) on Waveshare RP2350-PiZero
; ============================================================================
; Target Board: Waveshare RP2350-PiZero (RP2350B, 16MB QSPI Flash, 8MB PSRAM)
;
; Hardware Pin Map (Waveshare RP2350-PiZero):
;   - DVI/HDMI (PIO0, GPIO base 16):
;       CLK-/+ : GPIO 32 / 33
;       D0-/+  : GPIO 34 / 35 (Blue)
;       D1-/+  : GPIO 36 / 37 (Green)
;       D2-/+  : GPIO 38 / 39 (Red)
;   - MicroSD (SPI1):
;       SCK=GPIO 30, MOSI=GPIO 31, MISO=GPIO 40, CS=GPIO 43
;   - PSRAM (APS6404L 8MB QSPI):
;       CS1=GPIO 47 (Memory-mapped XIP @ 0x11000000)
;   - USB Host (Dual-Port Keyboard / Gamepad):
;       Port 0 (Native USB-OTG) + Port 1 (PIO-USB Host on GPIO 28 D+ / GPIO 29 D-)
;   - PS/2 Keyboard (PIO2 SM0):
;       CLK=GPIO 16, DATA=GPIO 17
;   - Audio Output (Runtime selectable in F4 Menu: HDMI / I2S / PWM):
;       HDMI   : 48 kHz L-PCM Data Island Packets over HDMI TMDS
;       I2S    : 48 kHz PCM5102 DAC on GPIO 18 (DIN), GPIO 19 (BCK), GPIO 21 (LRCK)
;       PWM    : 96 kHz Audio on GPIO 26
;   - NES Gamepad:
;       CLK=GPIO 6, LATCH=GPIO 5, DATA1=GPIO 9, DATA2=GPIO 10
;   - UART0 (Serial Monitor / Debug / C64 Monitor):
;       TX=GPIO 14, RX=GPIO 15 (115200 8N1)
; ============================================================================

[platformio]
default_envs = waveshare_rp2350_pizero

[env:waveshare_rp2350_pizero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_pizero
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 252000000L

; Disable Earle Philhower built-in Single-Port TinyUSB library
; (we use our lib/TinyUSB_DualHost for simultaneous Native + PIO-USB Host)
lib_ignore =
    Adafruit TinyUSB Library
    FatFS

build_unflags =
    -Os

build_flags =
    -std=gnu++20
    -O3
    -ffast-math
    -fno-strict-aliasing
    -Isrc
    -Isrc/fatfs
    -Isrc/sdcard
    -Ilib/Pico_PIO_USB/src
    -Ilib/TinyUSB_DualHost/src
    -DNO_USB
    -DPICO_PIO_USE_GPIO_BASE=1
    -DZERO2_PIO_USB_HOST=1
    -DFRODO_RP2350=1
    -DBOARD_Z0=1
    -DCPU_CLOCK_MHZ=252
    -DPSRAM_MAX_FREQ_MHZ=133
    -DMURMDOOM_PSRAM_SIZE_BYTES=8388608
    -DVIDEO_HDMI=1
    -DFIRMWARE_VERSION=\"2.0-WS-HDMI-AUDIO\"
    -DPICO_PANIC_FUNCTION=
    -DUSE_TINYUSB
    -DCFG_TUSB_MCU=OPT_MCU_RP2040
    -DCFG_TUH_ENABLED=1
    -DCFG_TUH_MAX_SPEED=OPT_MODE_FULL_SPEED
    -DCFG_TUH_RPI_PIO_USB=1
    -DCFG_TUD_ENABLED=0
    -DPICO_PIO_USB_PIN_DP=28
