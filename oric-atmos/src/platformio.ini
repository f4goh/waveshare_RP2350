; PlatformIO Project Configuration File
; ORIC ATMOS Emulator on Waveshare RP2350-PiZero (HDMI/DVI + Dual USB Host + PS/2 + SD + PSRAM)
; Framework: Arduino (Earle Philhower) - main() direct sans setup()/loop()

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_pizero
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 252000000L
monitor_speed = 115200
lib_ldf_mode = chain+
lib_ignore =
    Adafruit_TinyUSB_Arduino
build_flags =
    -DNO_USB
    -DPICO_PIO_USE_GPIO_BASE=1
    -DZERO2_PIO_USB_HOST=1
    -DF_CPU=252000000L
    -Ilib/Pico_PIO_USB/src
    -Ilib/TinyUSB_DualHost/src
    -Wall
    -Wextra
    -Wno-unused-parameter
lib_deps =
    SPI
    Wire
    SD
    Pico_PIO_USB
    TinyUSB_DualHost

[env:oric_rp2350_pizero]
build_flags =
    ${env.build_flags}
